# ============================================================================
# WINDOW MANAGEMENT
# ============================================================================

bind=SUPER,q,killclient
bind=SUPER+t,togglefloating
bind=SUPER+f,togglemaximizescreen
bind=SUPER+g,toggleglobal
bind=SUPER+c,centerwin
bind=SUPER+R,reload_config
bind=SUPER+m,quit
bind=SUPER+z,toggle_scratchpad


# ============================================================================
# FOCUS NAVIGATION
# ============================================================================

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down


# ============================================================================
# MOVE WINDOWS
# ============================================================================

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down


# ============================================================================
# TAG SWITCHING (1-10)
# ============================================================================

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

# --- Move window to tag (1-10) ---
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10


# ============================================================================
# OVERVIEW / LAYOUT
# ============================================================================

bind=SUPER,Tab,toggleoverview
bind=SUPER+SHIFT,n,switch_layout


# ============================================================================
# GAPS
# ============================================================================

bind=SUPER,minus,incgaps,-2
bind=SUPER,equal,incgaps,2


# ============================================================================
# APPLICATION LAUNCHING
# ============================================================================

bind=SUPER,Return,spawn,ghostty
bind=SUPER,e,spawn,nautilus --new-window --no-desktop
bind=SUPER,b,spawn,helium
bind=SUPER+SHIFT,b,spawn,helium --incognito
bind=SUPER,n,spawn,code --new-window


# ============================================================================
# CONTAINERS / VIRTUALIZATION TOOLING
# ============================================================================

bind=SUPER+SHIFT,p,spawn,pods
bind=SUPER+SHIFT,d,spawn,waydroid
bind=SUPER+SHIFT,v,spawn,virt-manager
bind=SUPER+SHIFT,c,spawn,virt-viewer --wait


# ============================================================================
# TERMINAL (dev-focused second terminal for logs/servers)
# ============================================================================

bind=SUPER+SHIFT,Return,spawn,ghostty --title=dev-term


# ============================================================================
# NOCTALIA (shell / panels)
# ============================================================================

bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER+i,spawn,noctalia msg settings-toggle
bind=SUPER+l,spawn,noctalia msg screen-lock
bind=SUPER+v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,i,spawn,noctalia msg idle-inhibitor-toggle


# ============================================================================
# AUDIO CONTROLS (work even when locked)
# ============================================================================

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute


# ============================================================================
# MEDIA & SYSTEM CONTROLS
# ============================================================================

bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up *
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down *
bind=NONE,XF86Search,spawn,noctalia msg power-cycle
bind=NONE,XF86PowerOff,spawn,/usr/lib/norix-dotfiles/power-button.sh


# ============================================================================
# MOUSE BINDINGS
# ============================================================================

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0


# ============================================================================
# SCREENSHOTS (grim + slurp + satty)
# ============================================================================

bind=NONE,Print,spawn,/usr/lib/norix-dotfiles/screenshot.sh fullscreen
bind=SHIFT,Print,spawn,/usr/lib/norix-dotfiles/screenshot.sh region
bind=CTRL,Print,spawn,/usr/lib/norix-dotfiles/screenshot.sh window
bind=SUPER,Print,spawn,/usr/lib/norix-dotfiles/screenshot.sh clip
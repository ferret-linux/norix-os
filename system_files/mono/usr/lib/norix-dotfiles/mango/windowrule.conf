# ============================================================================
# LAUNCHER WINDOWS (floating, small)
# ============================================================================

windowrule=isfloating:1,width:0.55,height:0.70,appid:steam
windowrule=isfloating:1,width:0.55,height:0.70,appid:lutris
windowrule=isfloating:1,width:0.55,height:0.70,appid:com.usebottles.bottles
windowrule=isfloating:1,width:0.55,height:0.70,appid:goverlay


# ============================================================================
# STEAM SUB-WINDOWS
# ============================================================================

windowrule=isfloating:1,appid:steam,title:^Friends List$
windowrule=isfloating:1,appid:steam,title:^Steam - News$
windowrule=isfullscreen:1,appid:steam,title:^Steam Big Picture Mode$


# ============================================================================
# GAME WINDOWS (gamescope / Proton / Wine)
# ============================================================================

windowrule=isfullscreen:1,appid:gamescope
windowrule=noblur:1,appid:gamescope
windowrule=noblur:1,title:\.exe$


# ============================================================================
# EDITOR / IDE WINDOWS
# ============================================================================

windowrule=isfloating:1,appid:code,title:^Quick Open$


# ============================================================================
# CONTAINERS / VIRTUALIZATION TOOLING
# ============================================================================

windowrule=isfloating:1,width:0.55,height:0.70,appid:io.github.marhkb.Pods


# ============================================================================
# VM MANAGER WINDOWS
# ============================================================================

windowrule=isfloating:1,width:0.55,height:0.65,appid:virt-manager
windowrule=isfloating:1,width:0.55,height:0.65,appid:org.gnome.Boxes


# ============================================================================
# VM CONSOLE / DISPLAY WINDOWS
# ============================================================================

windowrule=isfloating:1,width:0.70,height:0.75,appid:virt-viewer
windowrule=noblur:1,appid:virt-viewer


# ============================================================================
# FLOATING WINDOW RULES
# ============================================================================

# --- Small utility windows ---
windowrule=isfloating:1,width:0.45,height:0.45,appid:org.gnome.Characters
windowrule=isfloating:1,width:0.45,height:0.45,appid:kbd-layout-viewer
windowrule=isfloating:1,width:0.45,height:0.45,appid:org.gnome.FileRoller
windowrule=isfloating:1,width:0.45,height:0.45,appid:gnome-disks
windowrule=isfloating:1,width:0.45,height:0.45,appid:org.gnome.seahorse.Application
windowrule=isfloating:1,width:0.45,height:0.45,appid:zync.updater.ghostty.window

# --- Android / GPU settings ---
windowrule=isfloating:1,width:0.35,height:0.25,appid:Waydroid
windowrule=isfloating:1,width:0.35,height:0.25,appid:nvidia-settings

# --- Printer configuration ---
windowrule=isfloating:1,width:0.30,height:0.30,appid:system-config-printer

# --- File managers / theming tools ---
windowrule=isfloating:1,width:0.45,height:0.50,appid:org.gnome.Nautilus
windowrule=isfloating:1,width:0.45,height:0.50,appid:nwg-look

# --- Noctalia settings window ---
windowrule=isfloating:1,width:0.55,height:0.65,appid:dev.noctalia.Noctalia
windowrule=activation_bypass:1,appid:dev.noctalia.Noctalia